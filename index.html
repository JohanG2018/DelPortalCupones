<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delportal - Preview</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#0b0b0f;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .phone{
      width:390px;     /* phone width */
      height:844px;    /* phone height */
      border-radius:36px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 25px 70px rgba(0,0,0,.55);
      border:10px solid rgba(255,255,255,.10);
      position:relative;
    }

    .notch{
      position:absolute;
      top:12px;
      left:50%;
      transform:translateX(-50%);
      width:160px;
      height:26px;
      border-radius:20px;
      background:rgba(0,0,0,.25);
      z-index:2;
      pointer-events:none;
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#fff;
    }

    /* scale down on smaller screens */
    @media (max-height: 900px), (max-width: 420px){
      .phone{ transform: scale(0.92); transform-origin:center; }
    }
  </style>
</head>

<body>
  <div class="phone">
    <div class="notch"></div>
    <iframe src="app.html" title="Delportal App"></iframe>
  </div>
</body>
</html>
